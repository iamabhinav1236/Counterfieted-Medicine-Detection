<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrueDose AI · Admin sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><style>body{background:#f2f7f6}.auth-wrap{max-width:440px;margin:8vh auto;padding:28px;background:white;border:1px solid #dbe8e5;border-radius:20px;box-shadow:0 18px 50px #173f3910}.auth-wrap input{width:100%;padding:13px;border:1px solid #ccdcd8;border-radius:10px;margin:8px 0 16px}.auth-wrap button{width:100%}.flash{padding:10px 12px;border-radius:9px;margin:10px 0;background:#fff0ee;color:#8d3025}</style></head><body><main class="auth-wrap"><p class="kicker">TRUEDOSE AI · OPERATIONS</p><h1>Administrator sign in</h1><p>Manage the medicine registry and review audit activity.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash">{{ message }}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="password">Admin password</label><input id="password" type="password" name="password" required autocomplete="current-password"><button class="primary-btn" type="submit">Sign in securely →</button></form><p style="font-size:12px;color:#63736f;margin-top:20px">Configure a strong password and secret key before deployment.</p><a href="/">← Back to verification</a></main></body></html>
